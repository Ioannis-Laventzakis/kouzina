<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Kouzina Menu</title>
</head>
<body>
<h1>🍽 Kouzina Restaurant Menu</h1>

<table border="1">
    <thead>
    <tr>
        <th>Name</th>
        <th>Description</th>
        <th>Price (€)</th>
        <th>Category</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="item : ${items}">
        <td th:text="${item.name}"></td>
        <td th:text="${item.description}"></td>
        <td th:text="${item.price}"></td>
        <td th:text="${item.category}"></td>
    </tr>
    </tbody>
</table>

<p><a th:href="@{/menu/add}">Add New Dish</a></p>
</body>
</html>
