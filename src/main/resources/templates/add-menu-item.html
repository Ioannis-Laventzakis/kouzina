<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Add Menu Item</title>
</head>
<body>
<h1>Add a New Dish</h1>
<form th:action="@{/menu/add}" th:object="${menuItem}" method="post">
    <label>Name:</label>
    <input type="text" th:field="*{name}" /><br/>

    <label>Description:</label>
    <textarea th:field="*{description}"></textarea><br/>

    <label>Price (€):</label>
    <input type="number" step="0.01" th:field="*{price}" /><br/>

    <label>Category:</label>
    <input type="text" th:field="*{category}" /><br/>

    <button type="submit">Add Dish</button>
</form>

<p><a th:href="@{/menu}">Back to Menu</a></p>
</body>
</html>
